<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Naomi's Profile</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=M+PLUS+1p:wght@400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="stars"></div>
    <div class="container">
        <header class="header">
            <h1 class="neon-text">TARAKO</h1>
            <p class="subtitle">Welcome to My World</p>
        </header>

        <main>
            <section class="card" data-color="blue">
                <div class="card-content">
                    <h2>基本情報</h2>
                    <div class="info-grid">
                        <div class="info-item">
                            <span class="label">誕生日</span>
                            <span class="value">12月29日</span>
                        </div>
                        <div class="info-item">
                            <span class="label">血液型</span>
                            <span class="value">O型</span>
                        </div>
                    </div>
                </div>
            </section>

            <section class="card" data-color="purple">
                <div class="card-content">
                    <h2>好きなもの</h2>
                    <div class="info-item">
                        <span class="label">食べ物</span>
                        <span class="value">たらこ、ラーメン</span>
                    </div>
                    <div class="info-item">
                        <span class="label">世界観</span>
                        <span class="value">十二国記</span>
                    </div>
                </div>
            </section>

            <section class="card" data-color="pink">
                <div class="card-content">
                    <h2>バイブル</h2>
                    <ul class="book-list">
                        <li>あるヨギの自叙伝</li>
                        <li>人間の永遠の探究</li>
                        <li>バガヴァッド・ギーター</li>
                    </ul>
                </div>
            </section>

            <section class="card" data-color="blue">
                <div class="card-content">
                    <h2>趣味</h2>
                    <div class="hobbies">
                        <div class="hobby">
                            <div class="hobby-icon">
                                <svg viewBox="0 0 24 24" width="48" height="48">
                                    <path d="M12 4c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6zm-1-12h2v8h-2zm0 10h2v2h-2z" fill="#00f3ff"/>
                                    <path d="M12 4c-4.41 0-8 3.59-8 8s3.59 8 8 8 8-3.59 8-8-3.59-8-8-8zm0 14c-3.31 0-6-2.69-6-6s2.69-6 6-6 6 2.69 6 6-2.69 6-6 6z" fill="none" stroke="#b700ff" stroke-width="1.5"/>
                                </svg>
                            </div>
                            <span>ヨガ瞑想</span>
                        </div>
                        <div class="hobby">
                            <div class="hobby-icon">
                                <svg viewBox="0 0 24 24" width="48" height="48">
                                    <path d="M12 3v10.55c-.59-.34-1.27-.55-2-.55-2.21 0-4 1.79-4 4s1.79 4 4 4 4-1.79 4-4V7h4V3h-6z" fill="#ff00e6"/>
                                    <path d="M12 13.55c.73 0 1.41.21 2 .55V3h-6v4h4v6.55z" fill="#00f3ff" opacity="0.7"/>
                                </svg>
                            </div>
                            <span>歌</span>
                        </div>
                    </div>
                </div>
            </section>


            <section class="card" data-color="purple">
                <div class="card-content">
                    <h2>学習中</h2>
                    <div class="learning">
                        <div class="learning-item">
                            <span class="highlight">FXトレード</span>
                        </div>
                        <div class="learning-item">
                            <span class="highlight">Vibe Coding</span>
                        </div>
                    </div>
                </div>
            </section>


            <section class="card dream-card" data-color="pink">
                <div class="card-content">
                    <h2>将来の夢</h2>
                    <p class="dream-text">
                        FXトレードで安定的に大きく資産を増やし、余暇の時間を増やす。
                        その時間を利用してヨガ活動、自然と共存する生活、
                        困っている方の支援などをしたい
                    </p>
                </div>
            </section>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
